name: Demo collections

# Style tags and collection rules, the Hardware & Storage collection and
# the Deals compare-at prices (.github/scripts/demo_collections.py).
# Dry run unless apply = "apply".

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Type "apply" to write the changes (anything else = dry run)
        required: false
        default: ''

jobs:
  collections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get access token
        env:
          CLIENT_ID: f17f43c0543c78ace662dc5c8939fa86
          CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
        run: |
          token=$(curl -sS -f -X POST "https://kitchero-kitchen.myshopify.com/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r '.access_token')
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"

      - name: Update collections
        env:
          SHOP: kitchero-kitchen.myshopify.com
        run: |
          if [ "${{ inputs.apply }}" = "apply" ]; then
            python3 .github/scripts/demo_collections.py --apply | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 .github/scripts/demo_collections.py | tee -a "$GITHUB_STEP_SUMMARY"
          fi
