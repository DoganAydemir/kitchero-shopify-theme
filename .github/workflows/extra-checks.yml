name: Extra checks

# Keyboard checks on real desktop and mobile viewports, and Lighthouse
# desktop scores (Shopify requires an average of at least 60 for
# performance and 90 for accessibility on desktop and mobile).
on:
  workflow_dispatch:

jobs:
  keyboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Keyboard and touch targets
        env:
          STORE_URL: https://kitchero-kitchen.myshopify.com
          PASSWORD: ${{ secrets.SHOP_STORE_PASSWORD }}
        run: python .github/scripts/keyboard_check.py | tee -a "$GITHUB_STEP_SUMMARY"

  lighthouse-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          npm install -g lighthouse@12
      - name: Storefront cookie
        env:
          STORE_URL: https://kitchero-kitchen.myshopify.com
          PASSWORD: ${{ secrets.SHOP_STORE_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          from playwright.sync_api import sync_playwright
          store = os.environ['STORE_URL']
          with sync_playwright() as p:
              b = p.chromium.launch(); c = b.new_context(); pg = c.new_page()
              pg.goto(store + '/password', wait_until='domcontentloaded')
              if pg.locator('input[type="password"]').count():
                  pg.fill('input[type="password"]', os.environ['PASSWORD'])
                  pg.locator('input[type="password"]').press('Enter')
                  pg.wait_for_load_state('networkidle')
              cookie = '; '.join(f"{k['name']}={k['value']}" for k in c.cookies() if 'kitchero-kitchen' in k['domain'])
              json.dump({'Cookie': cookie}, open('headers.json', 'w'))
              b.close()
          PY
      - name: Lighthouse desktop (3 runs per page)
        run: |
          set +e
          for page in "/" "/products/premium-pull-down-kitchen-faucet" "/collections/kitchen-cabinets"; do
            for run in 1 2 3; do
              name=$(echo "$page" | tr '/' '_')_$run
              lighthouse "https://kitchero-kitchen.myshopify.com$page" --preset=desktop \
                --only-categories=performance,accessibility --extra-headers=headers.json \
                --chrome-flags="--headless=new --no-sandbox" --output=json --output-path="lh$name.json" --quiet
            done
          done
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, statistics
          rows = {}
          for f in sorted(glob.glob('lh*.json')):
              d = json.load(open(f)); url = d['requestedUrl'].split('.com')[1]
              perf = d['categories']['performance']['score']; acc = d['categories']['accessibility']['score']
              lcp = d['audits']['largest-contentful-paint']['numericValue']
              rows.setdefault(url, []).append((perf, acc, lcp))
          print('| Page (desktop) | Performance runs | Median | Accessibility | LCP median (s) |')
          print('|---|---|---|---|---|')
          meds = []
          for url, rs in rows.items():
              perfs = [round(r[0] * 100) for r in rs if r[0] is not None]
              med = statistics.median(perfs) if perfs else None
              meds.append(med)
              print(f"| {url} | {', '.join(map(str, perfs))} | {med} | {round(statistics.median([r[1] for r in rs]) * 100)} | {round(statistics.median([r[2] for r in rs]) / 1000, 2)} |")
          ok = [m for m in meds if m is not None]
          print(f"\nAverage of medians: {round(sum(ok) / len(ok), 1) if ok else 'n/a'}")
          PY
