name: HTML validation

# Runs the W3C Nu HTML Checker (vnu.jar) against rendered demo store pages.
# Errors that come from Shopify-injected markup (preview bar meta, ucp link,
# shop-js module script, dynamic checkout button, video_tag fallback image)
# are listed separately so theme-side errors stand out.
# Run it manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      theme_id:
        description: Theme ID to render (empty = live theme)
        required: false
        default: ''

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the Nu HTML Checker
        run: npm install --no-save vnu-jar@latest

      - name: Fetch pages
        env:
          STORE: https://kitchero-kitchen.myshopify.com
          PASSWORD: ${{ secrets.SHOP_STORE_PASSWORD }}
          THEME_ID: ${{ inputs.theme_id }}
        run: |
          mkdir -p pages
          curl -sS -c jar -b jar -o /dev/null "$STORE/password"
          curl -sS -c jar -b jar -o /dev/null -X POST "$STORE/password" \
            --data-urlencode "form_type=storefront_password" \
            --data-urlencode "utf8=✓" \
            --data-urlencode "password=$PASSWORD"
          suffix=""
          if [ -n "$THEME_ID" ]; then suffix="preview_theme_id=$THEME_ID"; fi
          # Every URL in the store sitemap (all products, collections, pages,
          # blog posts) plus templates the sitemap does not list.
          curl -sS -c jar -b jar "$STORE/sitemap.xml" | grep -oE '<loc>[^<]+' | sed 's#<loc>##; s#&amp;#\&#g' \
            | grep -v agentic > sitemaps.txt
          : > paths.txt
          while read -r sm; do
            curl -sS -c jar -b jar "$sm" | grep -oE '<loc>[^<]+' | sed 's#<loc>##; s#&amp;#\&#g' \
              | grep -vE '/cdn/|\.(jpe?g|png|webp|gif|md)$' | sed "s#^$STORE##" >> paths.txt
          done < sitemaps.txt
          printf '%s\n' / /collections /collections/all "/collections/kitchen-cabinets?view=drawer" \
            "/collections/kitchen-cabinets?view=vertical" /search "/search?q=sink" /cart /404-check \
            /policies/privacy-policy /policies/refund-policy /policies/terms-of-service /policies/shipping-policy >> paths.txt
          sort -u paths.txt -o paths.txt
          echo "Pages to validate: $(wc -l < paths.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          while read -r path; do
            [ -z "$path" ] && continue
            name=$(echo "$path" | sed 's#[/?=&.]#_#g; s#^_##'); name=${name:-home}
            sep="?"; case "$path" in *\?*) sep="&";; esac
            url="$STORE$path"; [ -n "$suffix" ] && url="$url$sep$suffix"
            curl -sS -c jar -b jar -L "$url" -o "pages/$name.html"
          done < paths.txt
          ls -la pages

      - name: Validate
        run: |
          java -jar node_modules/vnu-jar/build/dist/vnu.jar --format json pages/*.html 2> report.json || true
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, re, glob, os
          # Markup Shopify adds to every storefront (content_for_header, {% form %},
          # payment button, preview bar). Everything else counts as theme-side.
          platform = re.compile(
              r'charset” attribute on a “meta”|“version” not allowed on element “link”'
              r'|“type=module” must not have a “defer”|“payment” not allowed'
              r'|“disabled” not allowed on element “div”')
          shopify_extract = re.compile(r'shopifycloud|shopify-payment-button|name="form_type"|name="utf8"|preview-bar')
          data = json.load(open('report.json'))
          pages = sorted(os.path.basename(f)[:-5] for f in glob.glob('pages/*.html'))
          per = {pg: {'theme': [0, 0, 0], 'shopify': [0, 0, 0]} for pg in pages}
          theme = {}
          for m in data.get('messages', []):
              page = m.get('url', '').rsplit('/', 1)[-1].replace('.html', '')
              kind = 0 if m.get('type') == 'error' else (1 if m.get('subType') == 'warning' else 2)
              extract = re.sub(r'\s+', ' ', m.get('extract', ''))
              video_fallback = 'alt” attribute' in m['message'] and 'preview_images' in extract
              # /pages/data-sharing-opt-out: Shopify injects the privacy form body itself.
              privacy_body = page == 'pages_data-sharing-opt-out' and ('privacy-banner' in extract or '<p>As' in extract)
              is_shopify = bool(platform.search(m['message']) or shopify_extract.search(extract) or video_fallback or privacy_body)
              per.setdefault(page, {'theme': [0, 0, 0], 'shopify': [0, 0, 0]})['shopify' if is_shopify else 'theme'][kind] += 1
              if not is_shopify:
                  key = ['error', 'warning', 'info'][kind] + ': ' + m['message'][:120] + '  `' + extract[:90].replace('`', "'") + '`'
                  theme.setdefault(key, set()).add(page)
          print('## HTML validation (W3C Nu), errors + warnings + info\n')
          print(f'Pages checked: **{len(pages)}** · theme-side messages: **{sum(sum(v["theme"]) for v in per.values())}**\n')
          print('| Page | Theme errors | Theme warnings | Theme info | Shopify errors | Shopify warnings | Shopify info |')
          print('|---|---|---|---|---|---|---|')
          for pg in pages:
              t, sh = per[pg]['theme'], per[pg]['shopify']
              print(f'| {pg} | {t[0]} | {t[1]} | {t[2]} | {sh[0]} | {sh[1]} | {sh[2]} |')
          print('\n### Theme-side messages\n')
          for key, pg in sorted(theme.items()):
              print(f'- {key} — {", ".join(sorted(pg))}')
          if not theme:
              print('None.')
          EOF
