name: Install test

# Uploads the Theme Store package to an empty development store as an
# unpublished theme (audit #75). The store needs the "Kitchero Lighthouse CI"
# app installed. Run manually, then review the theme in that store's admin.

on:
  workflow_dispatch:
    inputs:
      store:
        description: Store domain (an empty development store)
        required: true
        default: kitchero-install-test.myshopify.com
      publish:
        description: Publish the uploaded theme (yes/no)
        required: true
        default: 'no'

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Get access token
        env:
          CLIENT_ID: f17f43c0543c78ace662dc5c8939fa86
          CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
          STORE: ${{ inputs.store }}
        run: |
          token=$(curl -sS -f -X POST "https://$STORE/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r '.access_token')
          echo "::add-mask::$token"
          echo "SHOPIFY_CLI_THEME_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Build the package folder
        run: |
          # Same file set as the Theme Store zip (package.yml), without
          # .shopifyignore, so templates and settings_data.json are included.
          mkdir -p /tmp/pkg
          git archive HEAD assets config layout locales sections snippets templates release-notes.md | tar -x -C /tmp/pkg
          find /tmp/pkg -type f | wc -l

      - name: Push unpublished theme
        env:
          SHOPIFY_FLAG_STORE: ${{ inputs.store }}
          SHOPIFY_CLI_TTY: '0'
          CI: '1'
        run: |
          shopify theme push --unpublished --theme "Kitchero 1.0.0 (install test)" --path /tmp/pkg --json > push.json
          jq -r '.theme | "Theme: \(.name) (#\(.id))\nEditor: \(.editor_url)"' push.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "THEME_ID=$(jq -r '.theme.id' push.json)" >> "$GITHUB_ENV"

      - name: Publish
        if: inputs.publish == 'yes'
        env:
          SHOPIFY_FLAG_STORE: ${{ inputs.store }}
          SHOPIFY_CLI_TTY: '0'
          CI: '1'
        run: shopify theme publish --theme "$THEME_ID" --force
