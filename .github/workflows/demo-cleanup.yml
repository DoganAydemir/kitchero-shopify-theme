name: Demo store cleanup

# Deletes every unpublished theme (old previews and backups) and every
# development theme (left behind by Lighthouse CI runs; a store allows 100)
# on the demo store. The live theme is never touched. Type "delete" to confirm.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "delete" to remove all unpublished and development themes
        required: true
      name_prefix:
        description: Only delete unpublished themes whose name starts with this (empty = all unpublished and development themes)
        required: false
        default: ''

jobs:
  cleanup:
    if: inputs.confirm == 'delete'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Get access token
        env:
          CLIENT_ID: f17f43c0543c78ace662dc5c8939fa86
          CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
        run: |
          token=$(curl -sS -f -X POST "https://kitchero-kitchen.myshopify.com/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r '.access_token')
          echo "::add-mask::$token"
          echo "SHOPIFY_CLI_THEME_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Delete unpublished themes
        env:
          NAME_PREFIX: ${{ inputs.name_prefix }}
          SHOPIFY_FLAG_STORE: kitchero-kitchen.myshopify.com
          SHOPIFY_CLI_TTY: '0'
          CI: '1'
        run: |
          for role in unpublished development; do
            shopify theme list --role "$role" --json
          done | jq -s '[flatten[] | select(type == "object")]' > themes.json
          if [ -n "$NAME_PREFIX" ]; then
            jq --arg p "$NAME_PREFIX" '[flatten[] | select(type == "object" and .role == "unpublished" and (.name | startswith($p)))]' themes.json > filtered.json
            mv filtered.json themes.json
          fi
          echo "Themes to delete: $(jq length themes.json)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "\(.id)\t\(.name)"' themes.json | while IFS=$'\t' read -r id name; do
            shopify theme delete --theme "$id" --force
            echo "- Deleted #$id $name" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          shopify theme list | tee -a "$GITHUB_STEP_SUMMARY"
