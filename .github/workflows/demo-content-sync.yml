name: Demo content sync

# Copies the content of a demo store theme (templates, section groups, theme
# settings) into the `demo` branch so content edits are versioned.

on:
  workflow_dispatch:
    inputs:
      source_theme:
        description: Theme ID to copy content from
        default: '189536567510'
        required: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Get access token
        env:
          CLIENT_ID: f17f43c0543c78ace662dc5c8939fa86
          CLIENT_SECRET: ${{ secrets.SHOP_CLIENT_SECRET }}
        run: |
          token=$(curl -sS -f -X POST "https://kitchero-kitchen.myshopify.com/admin/oauth/access_token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r '.access_token')
          echo "::add-mask::$token"
          echo "SHOPIFY_CLI_THEME_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Pull content
        env:
          SHOPIFY_FLAG_STORE: kitchero-kitchen.myshopify.com
          SHOPIFY_CLI_TTY: '0'
          CI: '1'
        run: |
          shopify theme pull --theme "${{ inputs.source_theme }}" --path . \
            --only 'templates/*.json' --only 'sections/*-group.json' --only 'config/settings_data.json'

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates sections config
          if git diff --cached --quiet; then echo "No content changes"; exit 0; fi
          git commit -m "content: sync from theme ${{ inputs.source_theme }}"
          git push origin demo
